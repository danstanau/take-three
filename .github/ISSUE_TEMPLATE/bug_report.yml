name: Bug report
description: Report a reproducible problem with Take Three
body:
  - type: markdown
    attributes:
      value: Do not include private recordings, credentials, or personal information. Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version, and operating system
    validations:
      required: true
